# muse2api Nginx reverse proxy example
# Works with standalone Nginx, Baota and 1Panel.
# The important parts: large timeouts for generation and buffering off for SSE.

server {
    listen 80;
    server_name your-domain.com; # Replace with your domain or IP.

    # Allow large reference-image uploads.
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Image and video generation can take several minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Required for zero-latency SSE chat streaming.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket compatibility (not required by the API itself).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
